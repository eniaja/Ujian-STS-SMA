<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sumatif Tengah Semester</title>

<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

<script src="https://unpkg.com/docx-preview@0.3.7/dist/docx-preview.min.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
}


/* LOGIN */

#loginPage {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


.card {

    width: 100%;

    max-width: 500px;

    background: white;

    padding: 30px;

    border-radius: 18px;

    box-shadow: 0 8px 30px rgba(0,0,0,.12);

}


h1 {

    text-align: center;

}


label {

    display: block;

    margin-top: 15px;

    font-weight: bold;

}


input {

    width: 100%;

    padding: 13px;

    margin-top: 7px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;

}


button {

    border: none;

    border-radius: 8px;

    padding: 13px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


#startButton {

    width: 100%;

    margin-top: 22px;

    background: #2563eb;

    color: white;

}


.error {

    color: red;

    text-align: center;

    margin-top: 15px;

}


/* UJIAN */

#examPage {

    display: none;

}


.header {

    position: sticky;

    top: 0;

    z-index: 1000;

    background: white;

    box-shadow: 0 2px 10px rgba(0,0,0,.12);

}


.headerTop {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 15px;

}


.timer {

    background: #dc2626;

    color: white;

    padding: 10px 15px;

    border-radius: 8px;

    font-weight: bold;

}


.toolbar {

    padding: 10px 15px;

    border-top: 1px solid #ddd;

}


.toolbar button {

    background: #111827;

    color: white;

    margin-right: 5px;

}


#wordContainer {

    max-width: 1100px;

    margin: 20px auto;

    background: #ddd;

    padding: 20px;

    overflow-x: auto;

}


.docx-wrapper {

    background: #ddd !important;

}


/* LOCK */

#lockPage {

    display: none;

    min-height: 100vh;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


.lockCard {

    background: white;

    width: 100%;

    max-width: 500px;

    padding: 30px;

    border-radius: 18px;

    text-align: center;

}


/* SELESAI */

#finishedPage {

    display: none;

    min-height: 100vh;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 20px;

}


.finishedCard {

    background: white;

    padding: 40px;

    border-radius: 18px;

}


@media(max-width:600px) {

    .headerTop {

        flex-direction: column;

        align-items: stretch;

        gap: 10px;

    }

    .timer {

        text-align: center;

    }

}

</style>

</head>


<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage">

    <div class="card">

        <h1>📝 Sumatif Tengah Semester</h1>

        <p style="text-align:center;">
            Silakan isi data sebelum memulai STS.
        </p>


        <label>Nama Siswa</label>

        <input
            type="text"
            id="studentName"
            placeholder="Masukkan nama lengkap"
        >


        <label>Kelas</label>

        <input
            type="text"
            id="studentClass"
            placeholder="Contoh: VII A"
        >


        <label>Password Ulangan</label>

        <input
            type="password"
            id="studentPassword"
            placeholder="Masukkan password"
        >


        <button id="startButton">
            MULAI ULANGAN
        </button>


        <div
            id="loginError"
            class="error">
        </div>

    </div>

</div>



<!-- ================= UJIAN ================= -->

<div id="examPage">

    <div class="header">

        <div class="headerTop">

            <div>

                <b>
                    🏫 SUMATIF TENGAH SEMESTER
                </b>

                <br>

                <small>

                    Nama:
                    <span id="displayName"></span>

                    &nbsp; | &nbsp;

                    Kelas:
                    <span id="displayClass"></span>

                </small>

            </div>


            <div
                id="timer"
                class="timer">

                00:00:00

            </div>

        </div>


        <div class="toolbar">

            <button id="fullscreenButton">
                ⛶ FULLSCREEN
            </button>

            <button id="wordButton">
                📄 PILIH FILE WORD
            </button>

            <input
                type="file"
                id="wordFile"
                accept=".docx"
                style="display:none"
            >

        </div>

    </div>


    <div id="wordContainer">

        <p style="text-align:center;">
            ⏳ Memuat soal...
        </p>

    </div>

</div>



<!-- ================= LOCK ================= -->

<div id="lockPage">

    <div class="lockCard">

        <h1>🔒</h1>

        <h2>ULANGAN TERKUNCI</h2>

        <p id="lockMessage">
            Anda meninggalkan halaman ulangan.
        </p>


        <input
            type="password"
            id="supervisorPassword"
            placeholder="Password Pengawas"
        >


        <button
            id="unlockButton"
            style="
                width:100%;
                margin-top:15px;
                background:#dc2626;
                color:white;
            "
        >
            BUKA ULANGAN
        </button>


        <div
            id="lockError"
            class="error">
        </div>

    </div>

</div>



<!-- ================= SELESAI ================= -->

<div id="finishedPage">

    <div class="finishedCard">

        <h1 style="color:#dc2626;">
            ⏰ WAKTU ULANGAN TELAH SELESAI
        </h1>

        <p>
            Waktu pengerjaan telah berakhir.
        </p>

        <p>
            Silakan ikuti instruksi guru/pengawas.
        </p>

    </div>

</div>



<script>

/* =================================================
   PENGATURAN
================================================= */

const CONFIG = {

    startDate: "2026-09-23T13:18:00",

    endDate: "2026-09-23T15:00:00",

    studentPassword: "siswa123",

    supervisorPassword: "guru123",

    wordFile: "soal.docx"

};


/* =================================================
   VARIABEL
================================================= */

let examStarted = false;

let examLocked = false;

let examFinished = false;

let timerInterval = null;


/* =================================================
   ELEMEN
================================================= */

const loginPage =
    document.getElementById("loginPage");

const examPage =
    document.getElementById("examPage");

const lockPage =
    document.getElementById("lockPage");

const finishedPage =
    document.getElementById("finishedPage");


/* =================================================
   MULAI ULANGAN
================================================= */

document
.getElementById("startButton")
.addEventListener("click", startExam);


function startExam() {

    const name =
        document
        .getElementById("studentName")
        .value
        .trim();


    const studentClass =
        document
        .getElementById("studentClass")
        .value
        .trim();


    const password =
        document
        .getElementById("studentPassword")
        .value;


    const error =
        document
        .getElementById("loginError");


    error.textContent = "";


    /* DATA KOSONG */

    if (
        name === "" ||
        studentClass === "" ||
        password === ""
    ) {

        error.textContent =
            "Semua data harus diisi.";

        return;

    }


    /* PASSWORD */

    if (
        password !==
        CONFIG.studentPassword
    ) {

        error.textContent =
            "Password ulangan salah.";

        return;

    }


    /* WAKTU */

    const now =
        new Date();

    const start =
        new Date(CONFIG.startDate);

    const end =
        new Date(CONFIG.endDate);


    if (now < start) {

        error.textContent =
            "Ulangan belum dimulai.";

        return;

    }


    if (now >= end) {

        showFinished();

        return;

    }


    /* TAMPILKAN DATA */

    document
    .getElementById("displayName")
    .textContent = name;


    document
    .getElementById("displayClass")
    .textContent = studentClass;


    /* PINDAH HALAMAN */

    loginPage.style.display =
        "none";

    examPage.style.display =
        "block";


    examStarted = true;


    /* TIMER */

    startTimer();


    /* WORD */

    loadWord();

}


/* =================================================
   LOAD WORD DARI GITHUB
================================================= */

async function loadWord() {

    const container =
        document
        .getElementById("wordContainer");


    container.innerHTML = `

        <div style="
            background:white;
            padding:30px;
            text-align:center;
            border-radius:10px;
        ">

            ⏳ Memuat soal Word...

        </div>

    `;


    try {

        const url =
            new URL(
                CONFIG.wordFile,
                window.location.href
            ).href;


        console.log(
            "Memuat:",
            url
        );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "File soal tidak ditemukan. HTTP "
                + response.status
            );

        }


        const blob =
            await response.blob();


        if (blob.size === 0) {

            throw new Error(
                "File Word kosong."
            );

        }


        container.innerHTML = "";


        await docx.renderAsync(

            blob,

            container,

            null,

            {

                className: "docx",

                inWrapper: true,

                breakPages: true,

                ignoreWidth: false,

                ignoreHeight: false,

                useBase64URL: true,

                renderHeaders: true,

                renderFooters: true,

                renderFootnotes: true,

                renderEndnotes: true

            }

        );


    }

    catch(error) {

        console.error(error);


        container.innerHTML = `

            <div style="
                background:white;
                padding:30px;
                text-align:center;
                border-radius:10px;
            ">

                <h2 style="color:red;">
                    ⚠️ SOAL TIDAK DAPAT DIMUAT
                </h2>

                <p>
                    ${error.message}
                </p>

                <p>
                    Gunakan tombol
                    <b>PILIH FILE WORD</b>
                    untuk membuka file secara manual.
                </p>

            </div>

        `;

    }

}


/* =================================================
   PILIH FILE WORD MANUAL
================================================= */

document
.getElementById("wordButton")
.addEventListener(
    "click",
    function() {

        document
        .getElementById("wordFile")
        .click();

    }
);


document
.getElementById("wordFile")
.addEventListener(
    "change",
    loadSelectedWord
);


async function loadSelectedWord(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const container =
        document
        .getElementById("wordContainer");


    try {

        const buffer =
            await file.arrayBuffer();


        container.innerHTML = "";


        await docx.renderAsync(

            buffer,

            container,

            null,

            {

                className: "docx",

                inWrapper: true,

                breakPages: true,

                useBase64URL: true

            }

        );

    }

    catch(error) {

        console.error(error);


        container.innerHTML =
            "<p>File Word tidak dapat dibaca.</p>";

    }

}


/* =================================================
   TIMER
================================================= */

function startTimer() {

    updateTimer();


    timerInterval =
        setInterval(
            updateTimer,
            1000
        );

}


function updateTimer() {

    if (
        !examStarted ||
        examFinished
    ) return;


    const now =
        new Date();


    const end =
        new Date(
            CONFIG.endDate
        );


    const difference =
        end - now;


    if (difference <= 0) {

        clearInterval(
            timerInterval
        );


        showFinished();


        return;

    }


    const totalSeconds =
        Math.floor(
            difference / 1000
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    document
    .getElementById("timer")
    .textContent =

        String(hours).padStart(2,"0")
        + ":"
        +
        String(minutes).padStart(2,"0")
        + ":"
        +
        String(seconds).padStart(2,"0");

}


/* =================================================
   FULLSCREEN
================================================= */

document
.getElementById("fullscreenButton")
.addEventListener(
    "click",
    function() {

        if (
            document.documentElement.requestFullscreen
        ) {

            document
            .documentElement
            .requestFullscreen();

        }

    }
);


/* =================================================
   DETEKSI PINDAH TAB
================================================= */

document.addEventListener(
    "visibilitychange",
    function() {

        if (

            document.visibilityState === "hidden"

            &&

            examStarted

            &&

            !examFinished

            &&

            !examLocked

        ) {

            lockExam();

        }

    }
);


/* =================================================
   LOCK
================================================= */

function lockExam() {

    examLocked = true;


    examPage.style.display =
        "none";


    lockPage.style.display =
        "flex";


    document
    .getElementById("lockMessage")
    .textContent =
        "Anda meninggalkan halaman ulangan.";

}


/* =================================================
   UNLOCK
================================================= */

document
.getElementById("unlockButton")
.addEventListener(
    "click",
    unlockExam
);


function unlockExam() {

    const password =
        document
        .getElementById("supervisorPassword")
        .value;


    const error =
        document
        .getElementById("lockError");


    if (
        password !==
        CONFIG.supervisorPassword
    ) {

        error.textContent =
            "Password pengawas salah.";

        return;

    }


    const now =
        new Date();

    const end =
        new Date(
            CONFIG.endDate
        );


    if (now >= end) {

        showFinished();

        return;

    }


    error.textContent = "";

    examLocked = false;


    lockPage.style.display =
        "none";


    examPage.style.display =
        "block";

}


/* =================================================
   SELESAI
================================================= */

function showFinished() {

    examFinished = true;

    examStarted = false;


    clearInterval(
        timerInterval
    );


    loginPage.style.display =
        "none";

    examPage.style.display =
        "none";

    lockPage.style.display =
        "none";

    finishedPage.style.display =
        "flex";

}


/* =================================================
   BLOKIR COPY
================================================= */

document.addEventListener(
    "copy",
    function(event) {

        if (examStarted) {

            event.preventDefault();

        }

    }
);


/* =================================================
   BLOKIR CUT
================================================= */

document.addEventListener(
    "cut",
    function(event) {

        if (examStarted) {

            event.preventDefault();

        }

    }
);


/* =================================================
   BLOKIR KLIK KANAN
================================================= */

document.addEventListener(
    "contextmenu",
    function(event) {

        if (examStarted) {

            event.preventDefault();

        }

    }
);

</script>

</body>

</html>
